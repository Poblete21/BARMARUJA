<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Online - Tu Bar</title>
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Definición de colores y fuente personalizada */
        :root {
            --bg-color: #F5F5DC; /* Beige claro */
            --accent-color: #28743A; /* Verde oscuro (Marca) */
            --text-color: #1a5632; /* Tono de texto para contraste */
            --header-color: #28743A; /* Verde para encabezados */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .menu-title {
            color: var(--accent-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .category-header {
            background-color: var(--accent-color);
            border: 2px solid var(--accent-color);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .category-header:hover {
            background-color: #3b9c59; /* Un verde ligeramente más claro en hover */
        }
        .item-card {
            background-color: white;
            border-left: 4px solid var(--accent-color);
        }
        .item-description {
            color: #4a5568; /* Gris oscuro para las descripciones */
        }
        
        /* Estilo para el icono (opcional si la imagen es png con transparencia) */
        .logo-container {
            border-bottom: 3px solid var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto p-4 sm:p-8">

        <!-- Encabezado y Logo (sin redondeo ni sombras) -->
        <header class="text-center pb-6 mb-8 logo-container">
            <img 
                src="https://i.imgur.com/xvwSFbK.png" 
                alt="Logo del Bar" 
                class="mx-auto mb-4 w-40 h-auto sm:w-48"
                onerror="this.onerror=null; this.src='https://placehold.co/192x192/28743A/F5F5DC?text=Logo';" 
            />
            <h1 class="menu-title text-5xl sm:text-6xl font-black uppercase tracking-wider">
                Nuestra Carta
            </h1>
            <p class="text-xl mt-2 font-light">Especialidades con sabor único.</p>
        </header>

        <!-- Contenedor del Menú -->
        <div id="menu-container">
            <!-- Los datos del menú se inyectarán aquí -->
        </div>

        <footer class="text-center mt-10 pb-4 text-sm opacity-60">
            <p>&copy; 2024 Tu Bar. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        // Datos del menú
        const menuData = [
            {
                category: "ENTRANTES",
                items: [
                    { name: "Alitas de pollo", description: "" },
                    { name: "Aros de cebolla", description: "" },
                    { name: "Aros de gouda", description: "" },
                    { name: "Cheddar bites con jalapeños", description: "" },
                    { name: "Buñuelos de bacalado", description: "" },
                    { name: "Saquitos de queso de cabra", description: "" },
                    { name: "Chicken pop", description: "" },
                    { name: "Tequeños", description: "" },
                    { name: "Patatas bravas", description: "" },
                    { name: "Patatas asadas con ajo", description: "" },
                    { name: "Empanada casera", description: "" },
                ]
            },
            {
                category: "PIZZAS Y PASTA",
                items: [
                    { name: "Pizza de jamón york y queso", description: "" },
                    { name: "Pizza 4 quesos", description: "" },
                    { name: "Pizza barbacoa", description: "" },
                    { name: "Pizza de jamón york, queso y pollo", description: "" },
                    { name: "Pizza ibérica", description: "Jamón serrano, queso y tomate" },
                    { name: "Lasaña De carne", description: "" },
                    { name: "Canelones de carne", description: "" },
                    { name: "Canelones de atún", description: "" },
                ]
            },
            {
                category: "HAMBURGUESAS",
                items: [
                    { name: "EXPLOSIVE BACON", description: "Carne de Angus, Bacon a la plancha, Cebolla Crunchy, Queso cheddar y Huevo" },
                    { name: "WOW BURGER", description: "Pollo crujiente, Queso cheddar, Bacon, Lechuga y Cebolla crunchy" },
                    { name: "BERNY BURGER", description: "Carne de Angus, Cebolla caramelizada y queso de cabra a la plancha" },
                    { name: "DOBLE CHEESE BURGER", description: "Doble Carne de angus, doble de queso cheddar, tomate, lechuga y bacon" },
                    { name: "TRIPLE BURGER", description: "Tres carnes de angus, triple de queso cheddar, bacon, huevo y tomate" },
                    { name: "SUPERBURGER", description: "Carne de angus, queso cheddar, bacon, tomate, lechuga, chorizo a la plancha y huevo frito" },
                    { name: "SQUID BURGER", description: "Carne de angus, aros de cebolla, queso cheddar y salsa barbacoa" },
                ]
            }
        ];

        const container = document.getElementById('menu-container');

        // Función para renderizar el menú y añadir la lógica del acordeón
        function renderMenu() {
            menuData.forEach((section, index) => {
                // Crear el contenedor de la categoría
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'mb-6 rounded-xl overflow-hidden shadow-lg';
                
                // Crear el encabezado plegable
                const header = document.createElement('button');
                header.className = 'category-header w-full flex justify-between items-center p-4 sm:p-5 font-extrabold text-xl sm:text-2xl text-white uppercase rounded-t-xl cursor-pointer focus:outline-none';
                header.innerHTML = `
                    <span>${section.category}</span>
                    <span id="icon-${index}" class="transform transition-transform duration-300">
                        <!-- Icono SVG de flecha hacia abajo (rotará al abrir) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </span>
                `;
                
                // Crear el cuerpo de la categoría (inicialmente abierto)
                const contentDiv = document.createElement('div');
                contentDiv.id = `content-${index}`;
                // Aplicamos clases para la transición de altura
                contentDiv.className = 'category-content transition-all duration-500 ease-in-out max-h-screen';
                
                // Crear las tarjetas de los productos
                const listContainer = document.createElement('div');
                listContainer.className = 'p-3 sm:p-5 space-y-3';

                section.items.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'item-card p-4 rounded-lg shadow-sm hover:shadow-md transition-shadow duration-200';
                    itemDiv.innerHTML = `
                        <h3 class="text-lg sm:text-xl font-bold uppercase mb-1">${item.name}</h3>
                        ${item.description ? `<p class="item-description text-sm">${item.description}</p>` : ''}
                    `;
                    listContainer.appendChild(itemDiv);
                });

                contentDiv.appendChild(listContainer);
                categoryDiv.appendChild(header);
                categoryDiv.appendChild(contentDiv);
                container.appendChild(categoryDiv);

                // Lógica del Acordeón
                const icon = document.getElementById(`icon-${index}`);
                
                header.addEventListener('click', () => {
                    // Alternar la visibilidad
                    if (contentDiv.classList.contains('max-h-screen')) {
                        contentDiv.classList.remove('max-h-screen');
                        contentDiv.classList.add('max-h-0', 'p-0');
                        icon.classList.remove('rotate-0');
                        icon.classList.add('rotate-180');
                    } else {
                        contentDiv.classList.remove('max-h-0', 'p-0');
                        contentDiv.classList.add('max-h-screen');
                        icon.classList.remove('rotate-180');
                        icon.classList.add('rotate-0');
                    }
                    // Quitar el padding extra cuando está cerrado
                    listContainer.classList.toggle('p-3', contentDiv.classList.contains('max-h-screen'));
                    listContainer.classList.toggle('sm:p-5', contentDiv.classList.contains('max-h-screen'));
                });

                // Inicializar en estado cerrado, excepto el primero
                if (index > 0) {
                    contentDiv.classList.remove('max-h-screen');
                    contentDiv.classList.add('max-h-0', 'p-0');
                    icon.classList.add('rotate-180');
                    listContainer.classList.remove('p-3', 'sm:p-5');
                }
            });
        }

        // Renderizar el menú cuando la ventana se cargue
        window.onload = renderMenu;
    </script>
</body>
</html>
